<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Valeria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .highlight {
            color: #764ba2;
            font-weight: 800;
        }

        .greeting-text {
            font-size: 1.3em;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.8;
            font-weight: 500;
        }

        .button-container {
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        .hidden {
            display: none;
        }

        .message {
            opacity: 0;
            animation: fadeInMessage 0.8s ease-out forwards;
        }

        @keyframes fadeInMessage {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .secret-message {
            font-size: 1.4em;
            color: #764ba2;
            margin-top: 30px;
            line-height: 1.8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .emoji {
            font-size: 3em;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .reset-btn {
            background: #999;
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 0.9em;
        }

        .reset-btn:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey <span class="highlight">Valeria</span> 💜</h1>
        
        <div id="greeting" class="greeting-text">
            I hope you're having an amazing day!
        </div>

        <div class="button-container">
            <button id="mainBtn" onclick="showMessage()">Click this button if u want to make it better</button>
        </div>

        <div id="messageSection" class="hidden">
            <div class="emoji">💭✨</div>
            <div class="secret-message message">
                I'm missing u and seeing u is something I really wish for... 💔✨
            </div>
            <button class="reset-btn" onclick="reset()">← Back</button>
        </div>
    </div>

    <script>
        function showMessage() {
            document.getElementById('greeting').classList.add('hidden');
            document.getElementById('mainBtn').classList.add('hidden');
            document.getElementById('messageSection').classList.remove('hidden');
        }

        function reset() {
            document.getElementById('greeting').classList.remove('hidden');
            document.getElementById('mainBtn').classList.remove('hidden');
            document.getElementById('messageSection').classList.add('hidden');
        }
    </script>
</body>
</html>
